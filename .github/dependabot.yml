# Dependabot: security updates only (version updates off: limit 0),
# one grouped security PR per ecosystem instead of one PR per advisory.

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
